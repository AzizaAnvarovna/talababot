<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalabaBot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    .chat { max-width: 720px; height: 100dvh; }
    .messages { overflow-y: auto; }
    .bubble { max-width: 85%; white-space: pre-line; overflow-wrap: anywhere; }
  </style>
</head>
<body class="bg-light">
  <main class="chat container d-flex flex-column p-2 p-sm-3">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <h1 class="h5 m-0">TalabaBot</h1>
      <div class="d-flex gap-2">
        <button id="operator" class="btn btn-sm btn-outline-primary">Operator bilan bogʻlanish</button>
        <button id="end" class="btn btn-sm btn-outline-secondary">Suhbatni yakunlash</button>
      </div>
    </header>
    <section id="messages" class="messages flex-grow-1 bg-white border rounded p-3 mb-2" aria-live="polite"></section>
    <div id="actions" class="d-flex flex-wrap gap-2 mb-2"></div>
    <form id="form" class="input-group">
      <input id="text" class="form-control" maxlength="2000" autocomplete="off"
             placeholder="Savolingizni yozing..." aria-label="Savol">
      <button class="btn btn-primary" type="submit">Yuborish</button>
    </form>
  </main>
  <script>
    const USER_KEY = "talababot_user_id";
    const HISTORY_KEY = "talababot_history";
    // Bu ikki amal yuqoridagi doimiy tugmalarda bor.
    const PERMANENT_ACTIONS = ["operator", "end"];
    const messages = document.getElementById("messages");
    const actions = document.getElementById("actions");
    const form = document.getElementById("form");
    const input = document.getElementById("text");

    function read(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function write(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* tarix faqat qulaylik uchun */ }
    }
    function userId() {
      let id = read(USER_KEY);
      if (!id) {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        id = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        write(USER_KEY, id);
      }
      return id;
    }

    let history = [];
    try { history = JSON.parse(read(HISTORY_KEY)) || []; } catch (e) { history = []; }

    function draw(sender, text) {
      const row = document.createElement("div");
      row.className = "d-flex mb-2 " + (sender === "me" ? "justify-content-end" : "");
      const bubble = document.createElement("div");
      bubble.className = "bubble rounded px-3 py-2 " + (sender === "me" ? "bg-primary text-white" : "bg-body-secondary");
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }
    function add(sender, text) {
      draw(sender, text);
      history.push([sender, text]);
      write(HISTORY_KEY, JSON.stringify(history.slice(-100)));
    }
    function showButtons(buttons) {
      actions.replaceChildren();
      for (const button of buttons.filter(b => !PERMANENT_ACTIONS.includes(b.action))) {
        const el = document.createElement("button");
        el.className = "btn btn-sm btn-outline-primary";
        el.textContent = button.label;
        el.addEventListener("click", () => { add("me", button.label); send({ action: button.action }); });
        actions.appendChild(el);
      }
    }

    async function send(body, showReply = true) {
      try {
        const response = await fetch("/api/chat/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ channel: "web", user_id: userId(), ...body }),
        });
        if (!response.ok) throw new Error(String(response.status));
        const reply = await response.json();
        if (showReply) add("bot", reply.text);
        showButtons(reply.buttons);
      } catch (e) {
        draw("bot", "Xatolik yuz berdi. Qayta urinib koʻring.");
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("me", text);
      send({ text });
    });
    document.getElementById("operator").addEventListener("click", () => send({ action: "operator" }));
    document.getElementById("end").addEventListener("click", () => send({ action: "end" }));

    history.forEach(([sender, text]) => draw(sender, text));
    // Tarix tiklangan bo'lsa, "Savolingizni yozing" qayta chiqmasin.
    send({ action: "start" }, history.length === 0);
  </script>
</body>
</html>
