{% extends "admin/base.html" %}
{% block content %}
{% if flash %}<div class="alert alert-info">{{ flash }}</div>{% endif %}
<h1 class="h5 mb-3">Jargon lugʻati ({{ terms|length }})</h1>
<form method="post" action="/admin/slang" class="row g-2 mb-3" style="max-width: 720px">
  <div class="col-12 col-sm-5"><input class="form-control" name="term" placeholder="Jargon soʻz" aria-label="Jargon soʻz" required></div>
  <div class="col-12 col-sm-5"><input class="form-control" name="replacement" placeholder="Toʻgʻri shakli" aria-label="Toʻgʻri shakli" required></div>
  <div class="col-12 col-sm-2"><button class="btn btn-primary w-100">Saqlash</button></div>
</form>
<div class="table-responsive bg-white border rounded" style="max-width: 720px">
  <table class="table table-sm align-middle mb-0">
    <thead><tr><th>Jargon</th><th>Toʻgʻri shakli</th><th></th></tr></thead>
    <tbody>
      {% for term in terms %}
      <tr>
        <td>{{ term.term }}</td>
        <td>{{ term.replacement }}</td>
        <td class="text-end">
          <form method="post" action="/admin/slang/{{ term.id }}/delete">
            <button class="btn btn-sm btn-outline-danger">Oʻchirish</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="text-center text-secondary py-4">Lugʻat boʻsh.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
