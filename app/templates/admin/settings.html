{% extends "admin/base.html" %}
{% block title %}Sozlamalar{% endblock %}
{% block content %}
<form method="post" action="/admin/settings" class="bg-white border rounded p-3" style="max-width: 560px">
  <h1 class="h5 mb-3">Sozlamalar</h1>
  {% if flash %}<div class="alert alert-info">{{ flash }}</div>{% endif %}
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <label class="form-label" for="tau">Ishonch chegarasi τ</label>
  <input class="form-control mb-3" id="tau" name="tau" value="{{ values.tau }}" required>

  <label class="form-label" for="sigma">Oʻxshashlik chegarasi σ</label>
  <input class="form-control mb-3" id="sigma" name="sigma" value="{{ values.sigma }}" required>

  <label class="form-label" for="active_model">Faol model</label>
  <select class="form-select mb-3" id="active_model" name="active_model">
    {% for model in models %}
    <option {% if values.active_model == model %}selected{% endif %}>{{ model }}</option>
    {% endfor %}
  </select>

  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="ab_enabled" name="ab_enabled" {% if values.ab_enabled %}checked{% endif %}>
    <label class="form-check-label" for="ab_enabled">A/B rejimi (yangi dialoglarga 50/50)</label>
  </div>
  <div class="row g-2 mb-3">
    <div class="col">
      <label class="form-label" for="ab_model_a">A model</label>
      <select class="form-select" id="ab_model_a" name="ab_model_a">
        {% for model in models %}<option {% if values.ab_model_a == model %}selected{% endif %}>{{ model }}</option>{% endfor %}
      </select>
    </div>
    <div class="col">
      <label class="form-label" for="ab_model_b">B model</label>
      <select class="form-select" id="ab_model_b" name="ab_model_b">
        {% for model in models %}<option {% if values.ab_model_b == model %}selected{% endif %}>{{ model }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <button class="btn btn-primary">Saqlash</button>
</form>
{% endblock %}
