<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TalabaBot admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-3">
    <div class="container">
      <a class="navbar-brand" href="/admin/kb">TalabaBot admin</a>
      {% block nav %}
      <div class="d-flex flex-wrap align-items-center gap-3">
        <a href="/admin/kb">Bilimlar bazasi</a>
        <a href="/admin/slang">Lugʻat</a>
        <a href="/admin/settings">Sozlamalar</a>
        <form method="post" action="/admin/logout">
          <button class="btn btn-sm btn-outline-secondary">Chiqish</button>
        </form>
      </div>
      {% endblock %}
    </div>
  </nav>
  <main class="container pb-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
