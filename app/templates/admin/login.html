{% extends "admin/base.html" %}
{% set bare = true %}
{% block title %}Kirish — TalabaBot{% endblock %}
{% block content_bare %}
<form method="post" action="/admin/login">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <label class="form-label fw-semibold small" for="login">Login</label>
  <input class="form-control form-control-lg mb-3" id="login" name="login" autocomplete="username" required autofocus>
  <label class="form-label fw-semibold small" for="password">Parol</label>
  <input class="form-control form-control-lg mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn btn-primary btn-lg w-100">Kirish</button>
</form>
{% endblock %}
